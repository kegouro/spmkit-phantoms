[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spmkit-phantoms"
version = "0.1.0"
description = "Generador de superficies analíticas (ground truth) para metrología SPM."
authors = [
    { name = "jlabarca@usm.cl" },
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
spmkit-phantoms = "spmkit_phantoms.cli:main"
